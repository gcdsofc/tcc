name: oficinapro-mvp

x-backend: &backend
  build: &backend-build
    context: ./backend
  restart: unless-stopped
  environment: &backend-env
    JWT_SECRET: ${JWT_SECRET:-local-dev-only-jwt-secret-change-me-0001}
    SERVICE_SECRET: ${SERVICE_SECRET:-local-service-secret}
    BOOTSTRAP_DEMO: "true"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: oficina
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only}
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oficina"]
      interval: 5s
      timeout: 3s
      retries: 20

  identity:
    <<: *backend
    build:
      <<: *backend-build
      args: { APP: identity }
    environment:
      <<: *backend-env
      PORT: 3001
      DATABASE_URL: postgres://oficina:${POSTGRES_PASSWORD:-local_dev_only}@postgres:5432/identitydb
      CUSTOMER_URL: http://customers:3002
      WORKORDERS_URL: http://workorders:3003
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
    depends_on: { postgres: { condition: service_healthy } }

  customers:
    <<: *backend
    build:
      <<: *backend-build
      args: { APP: customers }
    environment:
      <<: *backend-env
      PORT: 3002
      DATABASE_URL: postgres://oficina:${POSTGRES_PASSWORD:-local_dev_only}@postgres:5432/customersdb
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3002/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
    depends_on: { postgres: { condition: service_healthy } }

  workorders:
    <<: *backend
    build:
      <<: *backend-build
      args: { APP: workorders }
    environment:
      <<: *backend-env
      PORT: 3003
      DATABASE_URL: postgres://oficina:${POSTGRES_PASSWORD:-local_dev_only}@postgres:5432/workordersdb
      CUSTOMER_URL: http://customers:3002
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3003/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
    depends_on: { postgres: { condition: service_healthy } }

  web:
    build: { context: ., dockerfile: web/Dockerfile }
    ports: ["${WEB_PORT:-8080}:80"]
    depends_on:
      identity: { condition: service_healthy }
      customers: { condition: service_healthy }
      workorders: { condition: service_healthy }

volumes:
  pgdata:
