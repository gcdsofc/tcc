server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # DNS interno do Docker: o endereço de cada serviço é consultado de novo a cada 10 s,
  # então reconstruir um serviço não deixa o nginx apontando para um container antigo (erro 502).
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Rotas /internal/ são só para chamadas entre serviços dentro da rede Docker.
  location ~ ^/api/[a-z]+/internal/ { return 404; }

  location /api/identity/ {
    set $identity http://identity:3001;
    rewrite ^/api/identity/(.*)$ /$1 break;
    proxy_pass $identity;
  }
  location /api/customers/ {
    set $customers http://customers:3002;
    rewrite ^/api/customers/(.*)$ /$1 break;
    proxy_pass $customers;
  }
  location /api/orders/ {
    set $workorders http://workorders:3003;
    rewrite ^/api/orders/(.*)$ /$1 break;
    proxy_pass $workorders;
  }

  location / { try_files $uri $uri/ /index.html; }
}
