server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  # Rotas /internal/ são só para chamadas entre serviços dentro da rede Docker.
  location ~ ^/api/[a-z]+/internal/ { return 404; }
  location /api/identity/ { proxy_pass http://identity:3001/; }
  location /api/customers/ { proxy_pass http://customers:3002/; }
  location /api/orders/ { proxy_pass http://workorders:3003/; }
  location / { try_files $uri $uri/ /index.html; }
}
